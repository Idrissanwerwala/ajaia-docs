<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ajaia Docs</title><link rel="stylesheet" href="/styles.css"></head>
<body>
  <header><a class="brand" href="/">ajaia<span>docs</span></a><div class="header-right"><label class="user-label">Viewing as <select id="userSelect"></select></label><span id="saveStatus">All changes saved</span></div></header>
  <main>
    <aside><div class="sidebar-head"><div><p class="eyebrow">WORKSPACE</p><h2>Your documents</h2></div><button id="newDoc" class="primary">+ New</button></div><button id="importDoc" class="import">⇧ Import file</button><input id="fileInput" type="file" accept=".txt,.md,text/plain,text/markdown" hidden><p class="hint">Import <b>.txt</b> or <b>.md</b> as a new document.</p><div id="documentList" class="doc-list"></div></aside>
    <section class="canvas"><div id="empty" class="empty"><h1>Select or create a document</h1><p>Your documents are automatically saved and available after refresh.</p></div><article id="editorShell" hidden><div class="doc-meta"><input id="title" aria-label="Document title" maxlength="120"><button id="share" class="share">Share</button></div><div class="toolbar" aria-label="Formatting tools"><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><span></span><select id="blockFormat" aria-label="Text style"><option value="P">Body text</option><option value="H1">Heading 1</option><option value="H2">Heading 2</option><option value="H3">Heading 3</option></select><span></span><button data-cmd="insertUnorderedList">• List</button><button data-cmd="insertOrderedList">1. List</button></div><div id="editor" class="editor" contenteditable="true" aria-label="Document content"></div></article></section>
  </main><dialog id="shareDialog"><form method="dialog"><button class="close" aria-label="Close">×</button><p class="eyebrow">COLLABORATION</p><h2>Share “<span id="shareTitle"></span>”</h2><p id="shareHelp">People with access can view this document.</p><select id="shareUser"></select><button id="grant" value="default" class="primary full">Grant access</button></form></dialog><div id="toast" role="status"></div><script type="module" src="/app.js"></script>
</body></html>
